<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Florê Shaima | الرئيسية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@1,600;1,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #e84393;
            --primary-hover: #d63031;
            --secondary-color: #fd79a8;
            --bg-color: #fff5f8;
            --card-bg: #ffffff;
            --text-color: #2d3436;
            --text-light: #636e72;
            --shadow: 0 10px 20px rgba(232, 67, 147, 0.1);
            --transition: all 0.3s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        
        html, body {
            height: 100%;
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            line-height: 1.6; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header { background-color: var(--card-bg); box-shadow: var(--shadow); position: sticky; top: 0; z-index: 1000; }
        
        .navbar { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 0.8rem 1.2rem; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-wrap: nowrap;
        }
        
        .logo { 
            font-size: 1.3rem; 
            font-weight: 800; 
            color: var(--primary-color); 
            text-decoration: none; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            white-space: nowrap;
            font-family: 'Playfair Display', serif, 'Cairo';
            font-style: italic;
        }
        .logo img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-color);
            flex-shrink: 0;
        }

        .nav-links { display: flex; gap: 15px; list-style: none; align-items: center; }
        .nav-links a { text-decoration: none; color: var(--text-color); font-weight: 700; transition: var(--transition); font-size: 0.95rem; }
        .nav-links a:hover, .nav-links a.active { color: var(--primary-color); }
        
        /* Hero Section */
        .hero { 
            text-align: center; 
            padding: 5rem 1rem 4rem; 
            background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), 
                        url('https://raw.githubusercontent.com/yarn-flowers-saudi-store/sh/main/photo_2026-09-23_14-35-51.jpg');
            background-size: cover;
            background-position: center;
            color: white; 
            border-radius: 0 0 35px 35px; 
            margin-bottom: 1.5rem; 
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .hero h1 { 
            font-size: 2.8rem; 
            margin-bottom: 0.8rem; 
            text-shadow: 2px 2px 6px rgba(0,0,0,0.7); 
            font-family: 'Playfair Display', serif, 'Cairo';
            font-style: italic;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .hero p { 
            font-size: 1.15rem; 
            max-width: 550px; 
            margin: 0 auto 1.8rem; 
            opacity: 0.95; 
            text-shadow: 1px 1px 3px rgba(0,0,0,0.7); 
            font-weight: 600;
        }
        
        .btn-main { 
            background: var(--primary-color); 
            color: white; 
            padding: 0.75rem 2rem; 
            border-radius: 30px; 
            text-decoration: none; 
            font-weight: 700; 
            box-shadow: var(--shadow); 
            transition: var(--transition); 
            display: inline-block; 
            font-size: 1rem;
        }
        .btn-main:hover { background: var(--primary-hover); transform: translateY(-3px); }
        
        footer { 
            text-align: center; 
            padding: 1.2rem; 
            background: var(--card-bg); 
            color: var(--text-light); 
            margin-top: 0; 
            border-top: 1px solid #ffeaa7; 
            font-size: 0.9rem;
        }

        /* تعديلات شاشات الموبايل */
        @media (max-width: 480px) {
            .navbar { padding: 0.6rem 0.8rem; }
            .logo { font-size: 1.1rem; gap: 6px; }
            .logo img { width: 34px; height: 34px; }
            .nav-links { gap: 10px; }
            .nav-links a { font-size: 0.85rem; }
            .hero { padding: 3.5rem 1rem 3rem; border-radius: 0 0 25px 25px; margin-bottom: 1rem; }
            .hero h1 { font-size: 2.1rem; gap: 6px; }
            .hero p { font-size: 0.95rem; margin-bottom: 1.5rem; }
            .btn-main { padding: 0.65rem 1.6rem; font-size: 0.95rem; }
            footer { padding: 1rem; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <header>
        <div class="navbar">
            <a href="index.html" class="logo">
                <img src="https://raw.githubusercontent.com/yarn-flowers-saudi-store/sh/main/photo_2026-09-23_14-35-10.jpg" alt="Florê Shaima Logo">
                Florê Shaima
            </a>
            <ul class="nav-links">
                <li><a href="index.html" class="active">الرئيسية</a></li>
                <li><a href="products.html">المنتجات</a></li>
            </ul>
        </div>
    </header>

    <section class="hero">
        <h1>🪷 Florê Shaima 🌿</h1>
        <p>متجرك الأول للورد والديكورات المصنوعة يدوياً بكل حب لتناسب كل المناسبات الخاصة بك.</p>
        <a href="products.html" class="btn-main">تصفح المنتجات الآن</a>
    </section>

    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 - Florê Shaima 💕</p>
    </footer>
</body>
</html>
