<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowers Shemo | الرئيسية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #e84393;
            --primary-hover: #d63031;
            --secondary-color: #fd79a8;
            --bg-color: #fff5f8;
            --card-bg: #ffffff;
            --text-color: #2d3436;
            --text-light: #636e72;
            --shadow: 0 10px 20px rgba(232, 67, 147, 0.1);
            --transition: all 0.3s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; }
        header { background-color: var(--card-bg); box-shadow: var(--shadow); position: sticky; top: 0; z-index: 1000; }
        .navbar { max-width: 1200px; margin: 0 auto; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.8rem; font-weight: 800; color: var(--primary-color); text-decoration: none; display: flex; align-items: center; gap: 10px; }
        .nav-links { display: flex; gap: 20px; list-style: none; align-items: center; }
        .nav-links a { text-decoration: none; color: var(--text-color); font-weight: 600; transition: var(--transition); }
        .nav-links a:hover, .nav-links a.active { color: var(--primary-color); }
        .hero { text-align: center; padding: 5rem 1rem; background: linear-gradient(135deg, #ffeaa7 0%, #fab1a0 50%, #fd79a8 100%); color: white; border-radius: 0 0 50px 50px; margin-bottom: 3rem; }
        .hero h1 { font-size: 3rem; margin-bottom: 1rem; text-shadow: 1px 1px 3px rgba(0,0,0,0.1); }
        .hero p { font-size: 1.3rem; max-width: 600px; margin: 0 auto 2rem; opacity: 0.95; }
        .btn-main { background: white; color: var(--primary-color); padding: 0.8rem 2rem; border-radius: 30px; text-decoration: none; font-weight: 700; box-shadow: var(--shadow); transition: var(--transition); display: inline-block; }
        .btn-main:hover { background: var(--primary-color); color: white; transform: translateY(-3px); }
        footer { text-align: center; padding: 2rem; background: var(--card-bg); color: var(--text-light); margin-top: 4rem; border-top: 1px solid #ffeaa7; }
    </style>
</head>
<body>
    <header>
        <div class="navbar">
            <a href="index.html" class="logo">
                <i class="fa-solid fa-spa"></i> Flowers Shemo
            </a>
            <ul class="nav-links">
                <li><a href="index.html" class="active">الرئيسية</a></li>
                <li><a href="products.html">المنتجات</a></li>
            </ul>
        </div>
    </header>

    <section class="hero">
        <h1>مرحباً بكم في Flowers Shemo 🌸</h1>
        <p>متجرك الأول للورد والديكورات المصنوعة يدوياً بكل حب لتناسب كل المناسبات الخاصة بك.</p>
        <a href="products.html" class="btn-main">تصفح المنتجات الآن</a>
    </section>

    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 - Flowers Shemo 💕</p>
    </footer>
</body>
</html>
